<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">月食代码括号图标</title>
  <desc id="desc">月食负形与代码尖括号组成的极简技术图标。</desc>
  <defs>
    <linearGradient id="accent" x1="16" y1="16" x2="49" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8CF5DC"/>
      <stop offset=".58" stop-color="#4FD2D4"/>
      <stop offset="1" stop-color="#7B8CFF"/>
    </linearGradient>
    <mask id="eclipse">
      <rect width="64" height="64" fill="black"/>
      <circle cx="31" cy="32" r="17" fill="white"/>
      <circle cx="39" cy="27" r="16" fill="black"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0B1117"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#263840" stroke-width="2"/>
  <rect width="64" height="64" fill="url(#accent)" mask="url(#eclipse)"/>
  <path d="m43 27 5 5-5 5" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="40" cy="18" r="2" fill="#87F0DF"/>
</svg>

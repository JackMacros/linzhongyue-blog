# Copy this file to application.yml for Docker Compose deployments.
# Keep all secrets in environment variables or backend/.env.

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: linzhongyue-blog
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${BLOG_DB_URL}
    username: ${BLOG_DB_USERNAME}
    password: ${BLOG_DB_PASSWORD}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 12
      validation-query: SELECT 1
  data:
    redis:
      host: ${BLOG_REDIS_HOST}
      port: ${BLOG_REDIS_PORT:6379}
      password: ${BLOG_REDIS_PASSWORD:}
      database: ${BLOG_REDIS_DATABASE:0}
      timeout: 2s
  cache:
    type: redis
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${BLOG_SERVER_PORT:8080}
  forward-headers-strategy: framework

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${BLOG_SQL_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    banner: false
    db-config:
      id-type: auto

sa-token:
  token-name: blog-token
  timeout: ${BLOG_TOKEN_TIMEOUT:604800}
  active-timeout: ${BLOG_TOKEN_ACTIVE_TIMEOUT:10800}
  is-concurrent: false
  is-share: false
  token-style: tik
  is-read-cookie: true
  is-write-header: false
  is-log: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

blog:
  admin-bootstrap:
    username: ${BLOG_ADMIN_USERNAME:admin}
    password: ${BLOG_ADMIN_PASSWORD}
    nickname: ${BLOG_ADMIN_NICKNAME:Blog Admin}
    email: ${BLOG_ADMIN_EMAIL:}
  auth-cookie:
    secure: ${BLOG_AUTH_COOKIE_SECURE:true}
    same-site: Lax
  allowed-origins: ${BLOG_ALLOWED_ORIGINS}
  qiniu:
    access-key: ${BLOG_QINIU_ACCESS_KEY:}
    secret-key: ${BLOG_QINIU_SECRET_KEY:}
    bucket: ${BLOG_QINIU_BUCKET:}
    domain: ${BLOG_QINIU_DOMAIN:}
    zone: ${BLOG_QINIU_ZONE:auto}
  legacy-migration:
    enabled: ${BLOG_LEGACY_MIGRATION_ENABLED:false}
    url: ${BLOG_LEGACY_DB_URL:}
    username: ${BLOG_LEGACY_DB_USERNAME:}
    password: ${BLOG_LEGACY_DB_PASSWORD:}
    report-directory: ${BLOG_LEGACY_REPORT_DIR:migration-reports}

logging:
  level:
    root: INFO
    com.linzhongyue.blog: INFO
